name: PulseCast Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/PulseCast.App/PulseCast.App.csproj
      - name: Build
        run: dotnet build src/PulseCast.App/PulseCast.App.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish src/PulseCast.App/PulseCast.App.csproj -c Release -r win-x64 --self-contained false -o artifacts/PulseCast
      - uses: actions/upload-artifact@v4
        with:
          name: PulseCast-win-x64
          path: artifacts/PulseCast
